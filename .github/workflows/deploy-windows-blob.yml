name: Deploy Windows MSI to Azure Blob Storage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  MAUI_PROJECT_PATH: 'Client/src/Maui/AlertOne.Maui.csproj'
  STORAGE_ACCOUNT: 'alertoneeastus001'
  STORAGE_CONTAINER: 'downloads'
  MSI_NAME: 'alertone.msi'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if signing certificate is available
        id: check-cert
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNING_CERT)) {
            Write-Host "No signing certificate configured"
            echo "HAS_CERT=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Signing certificate is available"
            echo "HAS_CERT=true" >> $env:GITHUB_OUTPUT
          }

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify SDK version
        shell: pwsh
        run: |
          Write-Host "Using global.json from repository"
          if (Test-Path "global.json") {
            Get-Content "global.json"
          }
          Write-Host "SDK version:"
          dotnet --version

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix

      - name: Restore dependencies
        run: dotnet restore ${{ env.MAUI_PROJECT_PATH }} -p:TargetFramework=net9.0-windows10.0.19041.0

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "1.0.${{ github.run_number }}"
          }

          $parts = $version.Split('.')
          $major = if ($parts.Length -gt 0) { $parts[0] } else { "1" }
          $minor = if ($parts.Length -gt 1) { $parts[1] } else { "0" }
          $patch = if ($parts.Length -gt 2) { $parts[2] } else { "0" }

          $displayVersion = "$major.$minor.$patch"

          Write-Host "Display Version: $displayVersion"

          echo "DISPLAY_VERSION=$displayVersion" >> $env:GITHUB_OUTPUT

      - name: Decode signing certificate
        if: steps.check-cert.outputs.HAS_CERT == 'true'
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}\AlertOne.pfx", $pfxBytes)

      - name: Build Windows Application
        shell: pwsh
        run: |
          dotnet publish ${{ env.MAUI_PROJECT_PATH }} `
            -c Release `
            -f net9.0-windows10.0.19041.0 `
            -p:RuntimeIdentifier=win-x64 `
            -p:WindowsPackageType=None `
            -p:PublishSingleFile=true `
            -p:SelfContained=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:ApplicationDisplayVersion="${{ steps.version.outputs.DISPLAY_VERSION }}" `
            -p:ApplicationVersion="${{ github.run_number }}" `
            -o "${{ github.workspace }}/publish"

      - name: Create WiX source file
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.DISPLAY_VERSION }}"
          $publishDir = "${{ github.workspace }}/publish"
          $outputDir = "${{ github.workspace }}/output"

          New-Item -ItemType Directory -Force -Path $outputDir

          # Find the main executable
          $exeFile = Get-ChildItem -Path $publishDir -Filter "*.exe" | Where-Object { $_.Name -like "AlertOne*" } | Select-Object -First 1

          if ($null -eq $exeFile) {
            Write-Error "No executable found in publish directory"
            Get-ChildItem -Path $publishDir -Recurse
            exit 1
          }

          Write-Host "Found executable: $($exeFile.FullName)"

          # Generate a product GUID (use a fixed one for upgrades to work)
          $productGuid = [guid]::NewGuid().ToString().ToUpper()
          $upgradeGuid = "A1E2R3T4-O5N6-E7A8-P9P0-ABCDEF123456"

          # Create WiX source file
          $wxsContent = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="AlertOne"
                     Manufacturer="Phoenix Emergency Solutions"
                     Version="$version.0"
                     UpgradeCode="$upgradeGuid"
                     Compressed="yes">

              <MajorUpgrade DowngradeErrorMessage="A newer version of AlertOne is already installed." />
              <MediaTemplate EmbedCab="yes" />

              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="AlertOne">
                  <Component Id="MainExecutable" Guid="*">
                    <File Id="AlertOneExe" Source="$($exeFile.FullName)" KeyPath="yes" />
                  </Component>
                </Directory>
              </StandardDirectory>

              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="AlertOne">
                  <Component Id="ApplicationShortcut" Guid="*">
                    <Shortcut Id="ApplicationStartMenuShortcut"
                              Name="AlertOne"
                              Description="AlertOne Application"
                              Target="[INSTALLFOLDER]$($exeFile.Name)"
                              WorkingDirectory="INSTALLFOLDER" />
                    <RemoveFolder Id="CleanUpShortCut" Directory="ApplicationProgramsFolder" On="uninstall" />
                    <RegistryValue Root="HKCU" Key="Software\PhoenixEmergencySolutions\AlertOne" Name="installed" Type="integer" Value="1" KeyPath="yes" />
                  </Component>
                </Directory>
              </StandardDirectory>

              <StandardDirectory Id="DesktopFolder">
                <Component Id="DesktopShortcut" Guid="*">
                  <Shortcut Id="DesktopShortcut"
                            Name="AlertOne"
                            Description="AlertOne Application"
                            Target="[INSTALLFOLDER]$($exeFile.Name)"
                            WorkingDirectory="INSTALLFOLDER" />
                  <RegistryValue Root="HKCU" Key="Software\PhoenixEmergencySolutions\AlertOne" Name="desktopShortcut" Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </StandardDirectory>

              <Feature Id="ProductFeature" Title="AlertOne" Level="1">
                <ComponentRef Id="MainExecutable" />
                <ComponentRef Id="ApplicationShortcut" />
                <ComponentRef Id="DesktopShortcut" />
              </Feature>

            </Package>
          </Wix>
          "@

          $wxsPath = Join-Path $outputDir "AlertOne.wxs"
          $wxsContent | Out-File -FilePath $wxsPath -Encoding UTF8

          Write-Host "Created WiX source file: $wxsPath"
          echo "WXS_PATH=$wxsPath" >> $env:GITHUB_OUTPUT

      - name: Build MSI package
        id: msi
        shell: pwsh
        run: |
          $outputDir = "${{ github.workspace }}/output"
          $wxsPath = Join-Path $outputDir "AlertOne.wxs"
          $msiPath = Join-Path $outputDir "${{ env.MSI_NAME }}"

          # Build the MSI using WiX
          wix build $wxsPath -o $msiPath -arch x64

          if (Test-Path $msiPath) {
            Write-Host "MSI created successfully: $msiPath"
            $fileSize = (Get-Item $msiPath).Length / 1MB
            Write-Host "MSI file size: $([math]::Round($fileSize, 2)) MB"
            echo "MSI_PATH=$msiPath" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "MSI file was not created"
            exit 1
          }

      - name: Sign MSI package
        if: steps.check-cert.outputs.HAS_CERT == 'true'
        shell: pwsh
        run: |
          $msiPath = "${{ steps.msi.outputs.MSI_PATH }}"
          $pfxPath = "${{ github.workspace }}\AlertOne.pfx"
          $password = "${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}"

          # Install Windows SDK for signtool if not present
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse |
                      Sort-Object { $_.Directory.Name } -Descending |
                      Select-Object -First 1

          if ($null -eq $signtool) {
            Write-Host "Signtool not found, attempting to install Windows SDK..."
            choco install windows-sdk-10-version-2004-windbg -y --no-progress
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse |
                        Sort-Object { $_.Directory.Name } -Descending |
                        Select-Object -First 1
          }

          if ($null -ne $signtool) {
            Write-Host "Using signtool: $($signtool.FullName)"
            & $signtool.FullName sign /f $pfxPath /p $password /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $msiPath
            Write-Host "MSI signed successfully"
          } else {
            Write-Host "Warning: Signtool not found, MSI will not be signed"
          }

      - name: Skip signing (no certificate)
        if: steps.check-cert.outputs.HAS_CERT == 'false'
        run: |
          echo "::warning::MSI package is not signed. Set WINDOWS_SIGNING_CERT_BASE64 secret to enable signing."

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-${{ steps.version.outputs.DISPLAY_VERSION }}
          path: ${{ steps.msi.outputs.MSI_PATH }}
          retention-days: 30

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload MSI to Azure Blob Storage
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            VERSION="${{ steps.version.outputs.DISPLAY_VERSION }}"

            # Upload MSI as alertone.msi (overwrites existing)
            az storage blob upload \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --container-name ${{ env.STORAGE_CONTAINER }} \
              --name "${{ env.MSI_NAME }}" \
              --file "${{ steps.msi.outputs.MSI_PATH }}" \
              --overwrite true

            # Also upload a versioned copy for history
            az storage blob upload \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --container-name ${{ env.STORAGE_CONTAINER }} \
              --name "alertone-$VERSION.msi" \
              --file "${{ steps.msi.outputs.MSI_PATH }}" \
              --overwrite true

            echo "Uploaded MSI to: ${{ env.MSI_NAME }}"
            echo "Uploaded versioned MSI to: alertone-$VERSION.msi"

      - name: Generate download URLs
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            VERSION="${{ steps.version.outputs.DISPLAY_VERSION }}"

            echo "## Download Links" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### AlertOne Windows Installer v$VERSION" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| File | URL |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
            echo "| ${{ env.MSI_NAME }} (latest) | https://${{ env.STORAGE_ACCOUNT }}.blob.core.windows.net/${{ env.STORAGE_CONTAINER }}/${{ env.MSI_NAME }} |" >> $GITHUB_STEP_SUMMARY
            echo "| alertone-$VERSION.msi | https://${{ env.STORAGE_ACCOUNT }}.blob.core.windows.net/${{ env.STORAGE_CONTAINER }}/alertone-$VERSION.msi |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup sensitive files
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Path "${{ github.workspace }}\AlertOne.pfx" -Force -ErrorAction SilentlyContinue

      - name: Azure logout
        if: always()
        run: az logout

  notify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify on success
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "Windows MSI package successfully deployed to Azure Blob Storage!"
          echo "Download URL: https://alertoneeastus001.blob.core.windows.net/downloads/alertone.msi"

      - name: Notify on failure
        if: needs.build-and-deploy.result == 'failure'
        run: |
          echo "Windows MSI deployment failed!"
          exit 1
