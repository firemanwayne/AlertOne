name: Deploy UserManagement API

on:
  push:
    branches:
      - master
    paths:
      - 'Api/usrm/**'
      - 'Api/core/**'
      - 'Aspire/AlertOne.ServiceDefaults/**'
      - '.github/workflows/deploy-usermanagement-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'alertone-usrm-dev-eastus2-001'  # Set this to your Azure Function App name
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'Api/usrm/src/UserManagement.Client'
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Build
        run: dotnet build ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }} --configuration Release --output ./publish --no-build

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_USERMANAGEMENT }}
