name: Deploy UserManagement API

on:
  push:
    branches:
      - master
    paths:
      - 'Api/usrm/**'
      - 'Api/core/**'
      - '.github/workflows/deploy-usermanagement-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'alertone-usrm-dev-eastus2-001'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'Api/usrm/src/UserManagement.Client'
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and Publish
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet publish --configuration Release --output ./output
          popd

      - name: Create deployment package
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output
          zip -r ../../../deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: deploy.zip
