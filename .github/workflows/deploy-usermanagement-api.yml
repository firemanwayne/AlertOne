name: Deploy UserManagement API

on:
  push:
    branches:
      - master
    paths:
      - 'Api/usrm/**'
      - 'Api/core/**'
      - '.github/workflows/deploy-usermanagement-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'alertone-usrm-dev-eastus2-001'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'Api/usrm/src/UserManagement.Client'
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve Project Dependencies Using Dotnet
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet build --configuration Release --output ./output
          popd

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BB75283BCCC94D7E99FDA2F5BD53A061 }}
