name: Deploy AlertManagement API

on:
  push:
    branches:
      - master
    paths:
      - 'Api/alerts/**'
      - 'Api/core/**'
      - '.github/workflows/deploy-alertmanagement-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'alertone-alrtmg-dev-eastus2-001'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'Api/alerts/src/AlertManagement.Client'
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve Project Dependencies Using Dotnet
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet build --configuration Release --output ./output
          popd

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4241F97B2D734B29AB9CF2D2D23E7CFF }}
          scm-do-build-during-deployment: false
          enable-oryx-build: false
