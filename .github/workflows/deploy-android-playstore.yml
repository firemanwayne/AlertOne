name: Deploy Android to Google Play Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track to deploy to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: 'Release status'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - inProgress
          - halted
          - completed

env:
  DOTNET_VERSION: '9.0.102'
  MAUI_PROJECT_PATH: 'Client/src/Maui/AlertOne.Maui.csproj'
  ANDROID_PACKAGE_NAME: 'com.phoenixemergencysolutions.alertone.maui'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install MAUI workloads
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore ${{ env.MAUI_PROJECT_PATH }} -p:TargetFramework=net9.0-android

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi

          IFS='.' read -ra PARTS <<< "$VERSION"
          MAJOR="${PARTS[0]:-1}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"

          DISPLAY_VERSION="$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "Display Version: $DISPLAY_VERSION"
          echo "Version Code: $VERSION_CODE"

          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/alertone.keystore

      - name: Build Android App Bundle (AAB)
        run: |
          dotnet publish ${{ env.MAUI_PROJECT_PATH }} \
            -c Release \
            -f net9.0-android \
            --no-restore \
            -p:AndroidPackageFormat=aab \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="${{ github.workspace }}/alertone.keystore" \
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -p:ApplicationDisplayVersion="${{ steps.version.outputs.DISPLAY_VERSION }}" \
            -p:ApplicationVersion="${{ steps.version.outputs.VERSION_CODE }}"

      - name: Find AAB file
        id: find-aab
        run: |
          AAB_PATH=$(find Client/src/Maui/bin/Release/net9.0-android -name "*.aab" -type f | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "AAB file not found!"
            exit 1
          fi
          echo "Found AAB: $AAB_PATH"
          echo "AAB_PATH=$AAB_PATH" >> $GITHUB_OUTPUT

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ steps.version.outputs.DISPLAY_VERSION }}
          path: ${{ steps.find-aab.outputs.AAB_PATH }}
          retention-days: 30

      - name: Create service account JSON file
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > ${{ github.workspace }}/service-account.json

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ github.workspace }}/service-account.json
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: ${{ steps.find-aab.outputs.AAB_PATH }}
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.release_status || 'draft' }}
          whatsNewDirectory: .github/whatsnew

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f ${{ github.workspace }}/alertone.keystore
          rm -f ${{ github.workspace }}/service-account.json

  notify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify on success
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "Android app successfully deployed to Google Play Store!"
          echo "Track: ${{ inputs.track || 'internal' }}"

      - name: Notify on failure
        if: needs.build-and-deploy.result == 'failure'
        run: |
          echo "Android deployment failed!"
          exit 1
